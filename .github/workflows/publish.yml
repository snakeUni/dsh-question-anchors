# Publish to npm on every push to main using Trusted Publishing (OIDC).
# Configure npmjs.com with the GitHub repository and this workflow filename
# (`publish.yml`) before running a release.
#
# The workflow does not need `npm ci`/`npm install`: the package has no
# runtime dependencies (only peerDependencies), so `npm publish` runs
# directly on the checked-out tree.

name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip when this version is already published
        id: published
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "@dsh-client/ui-question-anchors@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@dsh-client/ui-question-anchors@${VERSION} already published — nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish initial version to npm
        if: steps.published.outputs.published == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
