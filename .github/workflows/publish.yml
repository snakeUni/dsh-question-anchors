# Publish to npm on every push to main.
#
# Setup (one time):
#   1. Create the GitHub repository and push this branch to `main`.
#   2. Generate an npm access token (npmjs.com → Access Tokens → Generate
#      New Token → "Publish" scope) and add it as a repository secret named
#      `NPM_TOKEN` (Settings → Secrets and variables → Actions).
#   3. Before pushing a release, bump `version` in package.json — npm never
#      allows overwriting an existing version, and the workflow skips runs
#      whose version is already published (so a re-push of an unchanged
#      version is a no-op, not a red X).
#
# The workflow does not need `npm ci`/`npm install`: the package has no
# runtime dependencies (only peerDependencies), so `npm publish` runs
# directly on the checked-out tree.

name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip when this version is already published
        id: published
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "@dsh-client/ui-question-anchors@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@dsh-client/ui-question-anchors@${VERSION} already published — nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
